<title>AIIO 模拟考场</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an exam console — sticky status strip (timer, progress), question pane + answer-sheet grid side by side, stacking on phones. */
:root {
  --bg: #f2f4f3;
  --surface: #ffffff;
  --sunk: #e8ecea;
  --ink: #16201c;
  --muted: #56625d;
  --line: #d5dcd9;
  --accent: #2c46a6;
  --accent-soft: #e3e8f8;
  --on-accent: #ffffff;
  --d1: #6a47b8;
  --d2: #18786d;
  --d3: #a8601a;
  --ok: #1d7444;
  --ok-soft: #dcefe3;
  --bad: #ad2a20;
  --bad-soft: #f6dfdc;
  --flag: #946700;
  --flag-soft: #f6ebcc;
  --font-display: "IBM Plex Sans Condensed", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-body: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #19201d; --sunk: #222a27; --ink: #e4ebe8; --muted: #9aa8a2; --line: #2f3935;
    --accent: #93a6f2; --accent-soft: #263156; --on-accent: #0f1530;
    --d1: #b297f0; --d2: #4fc4b3; --d3: #e7a463;
    --ok: #66cf94; --ok-soft: #1c3527; --bad: #f2897e; --bad-soft: #3d2220; --flag: #e8bd4f; --flag-soft: #3a311a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201d; --sunk: #222a27; --ink: #e4ebe8; --muted: #9aa8a2; --line: #2f3935;
  --accent: #93a6f2; --accent-soft: #263156; --on-accent: #0f1530;
  --d1: #b297f0; --d2: #4fc4b3; --d3: #e7a463;
  --ok: #66cf94; --ok-soft: #1c3527; --bad: #f2897e; --bad-soft: #3d2220; --flag: #e8bd4f; --flag-soft: #3a311a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.muted { color: var(--muted); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.d1 { color: var(--d1); } .chip.d2 { color: var(--d2); } .chip.d3 { color: var(--d3); }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip.flag { color: var(--flag); background: var(--flag-soft); border-color: transparent; }

/* ---------- home ---------- */
.masthead { background: var(--surface); border-bottom: 1px solid var(--line); }
.masthead .wrap { padding-block: 28px 22px; display: grid; gap: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.facts div { display: grid; }
.facts b { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 600; }
.blueprint { display: grid; gap: 6px; }
.bp-bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; }
.bp-bar span:nth-child(1) { background: var(--d1); } .bp-bar span:nth-child(2) { background: var(--d2); } .bp-bar span:nth-child(3) { background: var(--d3); }
.bp-legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.85rem; }
.bp-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; padding-block: 26px 48px; }
@media (max-width: 760px) { .home-grid { grid-template-columns: 1fr; } }
.modes { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.mode { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 16px 18px; align-items: center; border-top: 1px solid var(--line); }
.mode:first-child { border-top: 0; }
.mode p { color: var(--muted); font-size: 0.9rem; }
.mode .ctl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 480px) { .mode { grid-template-columns: 1fr; } .mode .ctl { justify-content: flex-start; } }
.resume { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 14px 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.side { display: grid; gap: 22px; align-content: start; }
.hist { display: grid; gap: 0; border-top: 1px solid var(--line); }
.hist-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
.hist-row .num { font-weight: 600; }
.tips { font-size: 0.88rem; color: var(--muted); display: grid; gap: 6px; padding-left: 18px; margin: 0; }
.kbd { font-family: var(--font-mono); font-size: 0.78rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); color: var(--ink); }

/* ---------- exam ---------- */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.strip .wrap { padding-block: 10px; display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; }
.strip .title { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin-right: auto; }
.timer { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.progress { height: 3px; background: var(--sunk); }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.exam-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; padding-block: 22px 60px; align-items: start; }
@media (max-width: 820px) { .exam-grid { grid-template-columns: 1fr; } }
.qpane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 18px; min-width: 0; }
@media (max-width: 480px) { .qpane { padding: 16px; } }
.qhead { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.qhead .qno { font-family: var(--font-mono); font-weight: 600; font-size: 0.95rem; }
.qtext { font-size: 1.08rem; line-height: 1.55; overflow-wrap: anywhere; }
.qtext code, .exp code { font-family: var(--font-mono); font-size: 0.9em; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.choose { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .key { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--line); font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt .txt { overflow-wrap: anywhere; padding-top: 1px; }
.exp { border-left: 3px solid var(--accent); background: var(--sunk); padding: 12px 14px; border-radius: 0 var(--r) var(--r) 0; font-size: 0.93rem; display: grid; gap: 6px; }
.qnav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
@media (max-width: 820px) { .sheet { position: static; } }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.cell { height: 34px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); font-family: var(--font-mono); font-size: 0.8rem; position: relative; padding: 0; }
.cell.done { background: var(--sunk); color: var(--ink); border-color: var(--muted); }
.cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; color: var(--ink); }
.cell.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--flag); }
.cell.right { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.cell.wrong { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.78rem; color: var(--muted); }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; font-size: 0.9rem; }

/* ---------- result ---------- */
.result-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px 36px; align-items: center; padding-block: 28px 8px; }
@media (max-width: 640px) { .result-top { grid-template-columns: 1fr; } }
.score { font-family: var(--font-mono); font-size: 4.2rem; font-weight: 600; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.4rem; color: var(--muted); }
.verdict { display: grid; gap: 8px; }
.bars { display: grid; gap: 14px; padding-block: 18px; }
.bar-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: 12px; align-items: center; font-size: 0.9rem; }
@media (max-width: 520px) { .bar-row { grid-template-columns: 1fr auto; } .bar-row .track { grid-column: 1 / -1; grid-row: 2; } }
.track { position: relative; height: 12px; background: var(--sunk); border-radius: 3px; }
.track span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.track .mark { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 28px; padding-block: 10px 60px; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.weak { display: grid; border-top: 1px solid var(--line); }
.weak-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.review { display: grid; gap: 14px; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.rv .opts { gap: 6px; }
.rv .opt { cursor: default; padding: 8px 10px; }
.rv .opt:hover { border-color: var(--line); }
.rv .opt.right:hover { border-color: var(--ok); } .rv .opt.wrong:hover { border-color: var(--bad); }
.note { font-size: 0.82rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>

<script src="questions.js"></script>
<script>
(function () {
  "use strict";
  var ALL = window.AIIO_QUESTIONS || [];
  var BY_ID = {}; ALL.forEach(function (q) { BY_ID[q.id] = q; });
  var DOMAINS = { 1: "AI 基础知识", 2: "AI 基础设施", 3: "AI 运维" };
  var DOMAIN_EN = { 1: "Essential AI Knowledge", 2: "AI Infrastructure", 3: "AI Operations" };
  var NOTE = { 1: "01-essential-ai-knowledge.md", 2: "02-ai-infrastructure.md", 3: "03-ai-operations.md" };
  var WEIGHT = { 1: 19, 2: 20, 3: 11 };
  var PASS = 0.7, READY = 0.8, EXAM_SECONDS = 60 * 60;
  var LETTERS = ["A", "B", "C", "D", "E"];
  var app = document.getElementById("app");

  // ---------- storage (per-viewer convenience only; page works without it) ----------
  function load(key, fallback) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  function drop(key) { try { localStorage.removeItem(key); } catch (e) {} }
  var K_WRONG = "aiio.wrong", K_HIST = "aiio.history", K_SESSION = "aiio.session";

  // ---------- helpers ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function mmss(s) { s = Math.max(0, Math.round(s)); var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function pct(x) { return Math.round(x * 100) + "%"; }
  function sameSet(a, b) { if (!a || a.length !== b.length) return false; var s = a.slice().sort().join(","); return s === b.slice().sort().join(","); }
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

  // ---------- state ----------
  var S = { view: "home", session: null, result: null, filter: "wrong", confirm: false };
  var timerHandle = null;

  function newSession(kind, opts) {
    var ids, title, timed = false, practice = false, shuffleOpts = false;
    if (kind === "A" || kind === "B") {
      ids = ALL.filter(function (q) { return q.set === kind; }).map(function (q) { return q.id; });
      title = "模拟考 " + kind; timed = true;
    } else if (kind === "random") {
      ids = [];
      [1, 2, 3].forEach(function (d) { ids = ids.concat(shuffle(ALL.filter(function (q) { return q.d === d; })).slice(0, WEIGHT[d]).map(function (q) { return q.id; })); });
      ids = shuffle(ids); title = "随机组卷"; timed = true; shuffleOpts = true;
    } else if (kind === "domain") {
      ids = shuffle(ALL.filter(function (q) { return q.d === opts.d; }).map(function (q) { return q.id; }));
      title = "领域练习 · " + DOMAINS[opts.d]; practice = true; shuffleOpts = true;
    } else if (kind === "wrong") {
      var w = load(K_WRONG, {});
      ids = shuffle(Object.keys(w).filter(function (id) { return BY_ID[id]; }));
      title = "错题重练"; practice = true; shuffleOpts = true;
    }
    var perm = {};
    ids.forEach(function (id) { var n = BY_ID[id].o.length, base = []; for (var i = 0; i < n; i++) base.push(i); perm[id] = shuffleOpts ? shuffle(base) : base; });
    return { kind: kind, title: title, ids: ids, perm: perm, answers: {}, checked: {}, flags: {}, cur: 0, timed: timed, practice: practice, remaining: timed ? EXAM_SECONDS : 0, elapsed: 0, started: today() };
  }

  function persistSession() { if (S.session) save(K_SESSION, S.session); }

  // ---------- scoring ----------
  function grade(sess) {
    var per = { 1: [0, 0], 2: [0, 0], 3: [0, 0] }, topics = {}, correct = 0;
    var items = sess.ids.map(function (id) {
      var q = BY_ID[id], ans = sess.answers[id] || [], ok = sameSet(ans, q.a);
      per[q.d][1]++; if (ok) { per[q.d][0]++; correct++; }
      var t = topics[q.t] || (topics[q.t] = { t: q.t, d: q.d, ref: q.ref, ok: 0, n: 0 }); t.n++; if (ok) t.ok++;
      return { id: id, ok: ok, answered: ans.length > 0, flagged: !!sess.flags[id] };
    });
    return { title: sess.title, kind: sess.kind, total: sess.ids.length, correct: correct, per: per, topics: topics, items: items, perm: sess.perm, answers: sess.answers, timeUsed: sess.timed ? EXAM_SECONDS - sess.remaining : sess.elapsed, timed: sess.timed, date: today() };
  }

  function recordWrongBook(res, practice) {
    var w = load(K_WRONG, {});
    res.items.forEach(function (it) {
      if (!it.ok) w[it.id] = (w[it.id] || 0) + 1;
      else if (practice && w[it.id] && S.session && S.session.kind === "wrong") delete w[it.id];
    });
    save(K_WRONG, w);
  }

  function finish() {
    stopTimer();
    var sess = S.session, res = grade(sess);
    recordWrongBook(res, sess.practice);
    var h = load(K_HIST, []);
    h.unshift({ date: res.date, title: res.title, correct: res.correct, total: res.total, per: res.per, timed: res.timed });
    save(K_HIST, h.slice(0, 30));
    drop(K_SESSION);
    S.result = res; S.session = null; S.view = "result"; S.confirm = false;
    S.filter = res.correct < res.total ? "wrong" : "all";
    render(); window.scrollTo(0, 0);
  }

  // ---------- timer ----------
  function startTimer() {
    stopTimer();
    timerHandle = setInterval(function () {
      var s = S.session; if (!s || S.view !== "exam") return;
      if (s.timed) { s.remaining -= 1; if (s.remaining <= 0) { s.remaining = 0; finish(); return; } }
      else s.elapsed += 1;
      var el = document.getElementById("timer");
      if (el) { el.textContent = s.timed ? mmss(s.remaining) : mmss(s.elapsed); el.classList.toggle("low", s.timed && s.remaining <= 300); }
      if ((s.timed ? s.remaining : s.elapsed) % 5 === 0) persistSession();
    }, 1000);
  }
  function stopTimer() { if (timerHandle) clearInterval(timerHandle); timerHandle = null; }

  // ---------- views ----------
  function homeView() {
    var wrongCount = Object.keys(load(K_WRONG, {})).filter(function (id) { return BY_ID[id]; }).length;
    var hist = load(K_HIST, []);
    var pending = load(K_SESSION, null);
    var h = '';
    h += '<header class="masthead"><div class="wrap">';
    h += '<span class="label">NVIDIA-Certified Associate · AI Infrastructure and Operations</span>';
    h += '<h1>AIIO 模拟考场</h1>';
    h += '<p class="muted" style="max-width:62ch">按 NCA-AIIO 考试结构自编的 100 道练习题（非真题）。题干用英文，与真实考试一致；解析用中文，并标出对应笔记章节。</p>';
    h += '<div class="facts">' +
      '<div><span class="label">题量</span><b>50</b></div>' +
      '<div><span class="label">时长</span><b>60:00</b></div>' +
      '<div><span class="label">每题平均</span><b>72 s</b></div>' +
      '<div><span class="label">自定及格线</span><b>70%</b></div>' +
      '<div><span class="label">可以去考</span><b>≥ 80%</b></div></div>';
    h += '<div class="blueprint"><div class="bp-bar" aria-hidden="true"><span style="width:38%"></span><span style="width:40%"></span><span style="width:22%"></span></div>' +
      '<div class="bp-legend"><span><i style="background:var(--d1)"></i>领域 1 AI 基础知识 38% · 19 题</span><span><i style="background:var(--d2)"></i>领域 2 AI 基础设施 40% · 20 题</span><span><i style="background:var(--d3)"></i>领域 3 AI 运维 22% · 11 题</span></div></div>';
    h += '</div></header>';

    h += '<main class="wrap home-grid"><section>';
    if (pending && pending.ids && BY_ID[pending.ids[0]]) {
      var answered = Object.keys(pending.answers || {}).length;
      h += '<div class="resume"><div><b>' + esc(pending.title) + '</b> 还没交卷 <span class="muted mono">已答 ' + answered + '/' + pending.ids.length + (pending.timed ? ' · 剩余 ' + mmss(pending.remaining) : '') + '</span></div>' +
        '<div class="row"><button class="btn primary" id="btn-resume">继续作答</button><button class="btn" id="btn-discard">放弃这次</button></div></div>';
    }
    h += '<div class="label" style="margin-bottom:8px">选择模式</div><div class="modes">';
    h += modeRow("模拟考 A", "50 题整卷，计时 60 分钟，交卷后出分和解析。第一次全真模拟用这套。", '<button class="btn primary" data-start="A">开始</button>');
    h += modeRow("模拟考 B", "另一套 50 题，考点与 A 不重复出题角度。复盘完 A 之后做。", '<button class="btn primary" data-start="B">开始</button>');
    h += modeRow("随机组卷", "从 100 题中按 19 / 20 / 11 的领域比例随机抽 50 题，选项顺序也打乱，防止背答案位置。", '<button class="btn" data-start="random">开始</button>');
    h += modeRow("领域练习", "不计时，每题作答后立即看对错和解析。适合按周学完一个领域后巩固。",
      '<button class="btn" data-start="domain" data-d="1">领域 1</button><button class="btn" data-start="domain" data-d="2">领域 2</button><button class="btn" data-start="domain" data-d="3">领域 3</button>');
    h += modeRow("错题重练", wrongCount ? "错题本里有 " + wrongCount + " 道题。重练时答对就会移出错题本。" : "错题本是空的。做完任意一次测验后，答错的题会自动收进来。",
      '<button class="btn" data-start="wrong"' + (wrongCount ? '' : ' disabled') + '>开始</button>');
    h += '</div></section>';

    h += '<aside class="side"><section><div class="label" style="margin-bottom:8px">最近成绩</div>';
    if (hist.length) {
      h += '<div class="hist">';
      hist.slice(0, 6).forEach(function (r) {
        var p = r.correct / r.total;
        h += '<div class="hist-row"><span>' + esc(r.title) + '</span><span class="num" style="color:' + (p >= PASS ? 'var(--ok)' : 'var(--bad)') + '">' + pct(p) + '</span>' +
          '<span class="muted mono" style="font-size:.78rem">' + esc(r.date) + '</span><span class="muted mono" style="font-size:.78rem">' +
          [1, 2, 3].map(function (d) { return 'D' + d + ' ' + r.per[d][0] + '/' + r.per[d][1]; }).join(' · ') + '</span></div>';
      });
      h += '</div><p class="note" style="margin-top:6px">成绩只保存在这个浏览器里。正式记录请抄到 cert-nca-aiio/README.md 的成绩表。</p>';
    } else {
      h += '<p class="muted" style="font-size:.9rem">还没有成绩。做完第一次测验后，这里会显示总分和三个领域的得分。</p>';
    }
    h += '</section><section><div class="label" style="margin-bottom:8px">作答快捷键</div><ul class="tips">' +
      '<li><span class="kbd">1</span>–<span class="kbd">4</span> 选择选项</li>' +
      '<li><span class="kbd">←</span> <span class="kbd">→</span> 上一题 / 下一题</li>' +
      '<li><span class="kbd">F</span> 标记这道题，稍后回看</li>' +
      '<li>"Choose two" 题两个选项都对才得分</li></ul></section></aside></main>';
    return h;
  }
  function modeRow(name, desc, ctl) { return '<div class="mode"><div><h3>' + name + '</h3><p>' + desc + '</p></div><div class="ctl">' + ctl + '</div></div>'; }

  function examView() {
    var s = S.session, id = s.ids[s.cur], q = BY_ID[id], ans = s.answers[id] || [], multi = q.a.length > 1;
    var checked = s.practice && s.checked[id];
    var answeredN = Object.keys(s.answers).filter(function (k) { return (s.answers[k] || []).length; }).length;
    var h = '<div class="strip"><div class="wrap">' +
      '<span class="title">' + esc(s.title) + '</span>' +
      '<span class="mono muted">已答 ' + answeredN + '/' + s.ids.length + '</span>' +
      '<span class="timer' + (s.timed && s.remaining <= 300 ? ' low' : '') + '" id="timer" aria-label="' + (s.timed ? '剩余时间' : '已用时间') + '">' + (s.timed ? mmss(s.remaining) : mmss(s.elapsed)) + '</span>' +
      '<button class="btn" id="btn-home">暂存退出</button>' +
      '<button class="btn primary" id="btn-submit">' + (s.practice ? '结束练习' : '交卷') + '</button>' +
      '</div><div class="progress"><span style="width:' + (answeredN / s.ids.length * 100) + '%"></span></div></div>';

    h += '<main class="wrap exam-grid"><section class="qpane" aria-live="polite">';
    h += '<div class="qhead"><span class="qno">第 ' + (s.cur + 1) + ' / ' + s.ids.length + ' 题</span>' +
      '<span class="chip d' + q.d + '">领域 ' + q.d + ' · ' + DOMAINS[q.d] + '</span>' +
      (s.flags[id] ? '<span class="chip flag">已标记</span>' : '') + '</div>';
    h += '<div class="qtext">' + fmt(q.q) + '</div>';
    if (multi) h += '<div class="choose">Choose ' + q.a.length + ' — 本题选 ' + q.a.length + ' 项</div>';
    h += '<div class="opts" role="' + (multi ? 'group' : 'radiogroup') + '">';
    s.perm[id].forEach(function (oi, pos) {
      var sel = ans.indexOf(oi) >= 0, cls = "opt";
      if (checked) { if (q.a.indexOf(oi) >= 0) cls += " right"; else if (sel) cls += " wrong"; }
      else if (sel) cls += " sel";
      h += '<label class="' + cls + '" for="opt-' + pos + '"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="opt" id="opt-' + pos + '" data-oi="' + oi + '"' + (sel ? ' checked' : '') + (checked ? ' disabled' : '') + '>' +
        '<span class="key">' + LETTERS[pos] + '</span><span class="txt">' + fmt(q.o[oi]) + '</span></label>';
    });
    h += '</div>';
    if (checked) {
      var ok = sameSet(ans, q.a);
      h += '<div class="exp"><div class="row"><span class="chip ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '回答正确' : '回答错误') + '</span><span class="note">考点：' + esc(q.t) + ' · 复习 ' + NOTE[q.d] + ' ' + esc(q.ref) + '</span></div><p>' + fmt(q.e) + '</p></div>';
    }
    h += '<div class="qnav"><div class="row"><button class="btn" id="btn-prev"' + (s.cur === 0 ? ' disabled' : '') + '>← 上一题</button>' +
      '<button class="btn" id="btn-flag">' + (s.flags[id] ? '取消标记' : '标记') + '</button></div><div class="row">';
    if (s.practice && !checked) h += '<button class="btn primary" id="btn-check"' + (ans.length ? '' : ' disabled') + '>检查答案</button>';
    h += '<button class="btn' + (s.practice && !checked ? '' : ' primary') + '" id="btn-next"' + (s.cur === s.ids.length - 1 ? ' disabled' : '') + '>下一题 →</button></div></div>';
    h += '</section>';

    h += '<aside class="sheet"><div class="row" style="justify-content:space-between"><span class="label">答题卡</span><span class="mono muted" style="font-size:.8rem">' + id + '</span></div><div class="cells">';
    s.ids.forEach(function (qid, i) {
      var a = s.answers[qid] || [], cls = "cell";
      if (s.practice && s.checked[qid]) cls += sameSet(a, BY_ID[qid].a) ? " right" : " wrong";
      else if (a.length) cls += " done";
      if (s.flags[qid]) cls += " flagged";
      if (i === s.cur) cls += " cur";
      h += '<button class="' + cls + '" data-go="' + i + '" aria-label="第 ' + (i + 1) + ' 题">' + (i + 1) + '</button>';
    });
    h += '</div><div class="legend"><span>灰底 = 已答</span><span>黄点 = 已标记</span>' + (s.practice ? '<span>绿/红 = 对/错</span>' : '') + '</div>';
    if (S.confirm) {
      var un = s.ids.length - answeredN, fl = s.ids.filter(function (k) { return s.flags[k]; }).length;
      h += '<div class="confirm"><b>' + (s.practice ? '结束练习并查看结果？' : '确认交卷？') + '</b><span>' +
        (un ? '还有 <b>' + un + '</b> 题没作答（不作答按错计）。' : '所有题目都已作答。') + (fl ? ' 有 <b>' + fl + '</b> 题标记了还没回看。' : '') + '</span>' +
        '<div class="row"><button class="btn danger" id="btn-confirm">' + (s.practice ? '结束' : '交卷') + '</button><button class="btn" id="btn-cancel">继续作答</button></div></div>';
    }
    h += '</aside></main>';
    return h;
  }

  function resultView() {
    var r = S.result, p = r.correct / r.total;
    var h = '<div class="strip"><div class="wrap"><span class="title">' + esc(r.title) + ' · 成绩</span>' +
      '<button class="btn" id="btn-home">返回首页</button>' +
      (r.correct < r.total ? '<button class="btn primary" id="btn-redo">重练本次错题</button>' : '') + '</div></div>';
    h += '<main class="wrap">';
    h += '<section class="result-top"><div class="score">' + Math.round(p * 100) + '<small>%</small></div><div class="verdict">' +
      '<div class="row"><span class="chip ' + (p >= READY ? 'ok' : p >= PASS ? 'flag' : 'bad') + '">' + (p >= READY ? '达到 80%，可以安排考试' : p >= PASS ? '过了 70% 自定线，再巩固薄弱项' : '低于 70% 自定线') + '</span></div>' +
      '<p class="mono">答对 ' + r.correct + ' / ' + r.total + ' · ' + (r.timed ? '用时 ' : '练习时长 ') + mmss(r.timeUsed) + ' · ' + esc(r.date) + '</p>' +
      '<p class="note">官方不公布及格线，70% / 80% 是本仓库的自定标准。</p></div></section>';

    h += '<section class="bars" aria-label="分领域得分">';
    [1, 2, 3].forEach(function (d) {
      var c = r.per[d][0], n = r.per[d][1], x = n ? c / n : 0;
      if (!n) return;
      h += '<div class="bar-row"><span><span class="chip d' + d + '">D' + d + '</span> ' + DOMAINS[d] + '</span>' +
        '<div class="track" title="' + DOMAIN_EN[d] + '"><span style="width:' + (x * 100) + '%;background:var(--d' + d + ')"></span><i class="mark" style="left:' + (PASS * 100) + '%"></i></div>' +
        '<span class="num" style="text-align:right">' + c + '/' + n + ' · ' + pct(x) + '</span></div>';
    });
    h += '<p class="note">虚线 = 70%。任何一个领域低于虚线，都先回到对应笔记再做"领域练习"。</p></section>';

    var weak = Object.keys(r.topics).map(function (k) { return r.topics[k]; }).filter(function (t) { return t.ok / t.n < PASS; })
      .sort(function (a, b) { return a.ok / a.n - b.ok / b.n || b.n - a.n; });
    h += '<div class="cols"><section><h2 style="margin-bottom:10px">薄弱考点</h2>';
    if (weak.length) {
      h += '<div class="weak">';
      weak.forEach(function (t) {
        h += '<div class="weak-row"><span>' + esc(t.t) + '</span><span class="num" style="color:var(--bad)">' + t.ok + '/' + t.n + '</span>' +
          '<span class="note">' + NOTE[t.d] + ' ' + esc(t.ref) + '</span><span class="chip d' + t.d + '">D' + t.d + '</span></div>';
      });
      h += '</div>';
    } else h += '<p class="muted">没有正确率低于 70% 的考点。</p>';
    h += '</section><section><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>逐题解析</h2><div class="tabs" role="group" aria-label="筛选">';
    var wrongN = r.items.filter(function (i) { return !i.ok; }).length, flagN = r.items.filter(function (i) { return i.flagged; }).length;
    [["wrong", "错题 " + wrongN], ["flag", "标记 " + flagN], ["all", "全部 " + r.total]].forEach(function (t) {
      h += '<button class="tab" data-filter="' + t[0] + '" aria-pressed="' + (S.filter === t[0]) + '">' + t[1] + '</button>';
    });
    h += '</div></div><div class="review">';
    var list = r.items.filter(function (i) { return S.filter === "all" || (S.filter === "wrong" ? !i.ok : i.flagged); });
    if (!list.length) h += '<p class="muted">这个筛选下没有题目。</p>';
    list.forEach(function (it) {
      var q = BY_ID[it.id], ans = r.answers[it.id] || [], n = r.items.indexOf(it) + 1;
      h += '<article class="rv"><div class="qhead"><span class="qno">' + n + '. ' + it.id + '</span><span class="chip d' + q.d + '">D' + q.d + '</span>' +
        '<span class="chip ' + (it.ok ? 'ok' : 'bad') + '">' + (it.ok ? '正确' : it.answered ? '错误' : '未作答') + '</span>' + (it.flagged ? '<span class="chip flag">标记</span>' : '') + '</div>' +
        '<div class="qtext" style="font-size:1rem">' + fmt(q.q) + '</div><div class="opts">';
      r.perm[it.id].forEach(function (oi, pos) {
        var cls = "opt"; if (q.a.indexOf(oi) >= 0) cls += " right"; else if (ans.indexOf(oi) >= 0) cls += " wrong";
        h += '<div class="' + cls + '"><span class="key">' + LETTERS[pos] + '</span><span class="txt">' + fmt(q.o[oi]) + (ans.indexOf(oi) >= 0 ? ' <span class="note">← 你的选择</span>' : '') + '</span></div>';
      });
      h += '</div><div class="exp"><p>' + fmt(q.e) + '</p><span class="note">考点：' + esc(q.t) + ' · 复习 ' + NOTE[q.d] + ' ' + esc(q.ref) + '</span></div></article>';
    });
    h += '</div></section></div></main>';
    return h;
  }

  // ---------- render + events ----------
  function render() {
    app.innerHTML = S.view === "exam" ? examView() : S.view === "result" ? resultView() : homeView();
  }

  function go(i) { var s = S.session; if (i < 0 || i >= s.ids.length) return; s.cur = i; S.confirm = false; persistSession(); render(); }

  function choose(oi) {
    var s = S.session, id = s.ids[s.cur], q = BY_ID[id];
    if (s.practice && s.checked[id]) return;
    var a = (s.answers[id] || []).slice();
    if (q.a.length > 1) { var k = a.indexOf(oi); if (k >= 0) a.splice(k, 1); else a.push(oi); }
    else a = [oi];
    s.answers[id] = a; persistSession(); render();
    var input = app.querySelector('input[data-oi="' + oi + '"]'); if (input) input.focus();
  }

  app.addEventListener("click", function (ev) {
    var t = ev.target.closest("button, input"); if (!t) return;
    if (t.matches("input[data-oi]")) { ev.preventDefault(); choose(+t.getAttribute("data-oi")); return; }
    if (t.dataset.start) {
      S.session = newSession(t.dataset.start, { d: +t.dataset.d });
      if (!S.session.ids.length) { S.session = null; return; }
      S.view = "exam"; S.confirm = false; persistSession(); render(); startTimer(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.go) { go(+t.dataset.go); return; }
    if (t.dataset.filter) { S.filter = t.dataset.filter; render(); return; }
    switch (t.id) {
      case "btn-resume": S.session = load(K_SESSION, null); S.view = "exam"; render(); startTimer(); break;
      case "btn-discard": drop(K_SESSION); render(); break;
      case "btn-home": if (S.session) persistSession(); stopTimer(); S.session = null; S.view = "home"; S.confirm = false; render(); window.scrollTo(0, 0); break;
      case "btn-prev": go(S.session.cur - 1); break;
      case "btn-next": go(S.session.cur + 1); break;
      case "btn-flag": var s = S.session, id = s.ids[s.cur]; if (s.flags[id]) delete s.flags[id]; else s.flags[id] = true; persistSession(); render(); break;
      case "btn-check": S.session.checked[S.session.ids[S.session.cur]] = true; persistSession(); render(); break;
      case "btn-submit": S.confirm = true; render(); var c = document.getElementById("btn-confirm"); if (c) c.focus(); break;
      case "btn-cancel": S.confirm = false; render(); break;
      case "btn-confirm": finish(); break;
      case "btn-redo":
        var wrongIds = S.result.items.filter(function (i) { return !i.ok; }).map(function (i) { return i.id; });
        var sess = newSession("wrong", {}); sess.ids = shuffle(wrongIds); sess.title = "重练：" + S.result.title + " 错题";
        sess.perm = {}; sess.ids.forEach(function (id) { sess.perm[id] = shuffle(BY_ID[id].o.map(function (_, i) { return i; })); });
        S.session = sess; S.view = "exam"; persistSession(); render(); startTimer(); window.scrollTo(0, 0); break;
    }
  });

  document.addEventListener("keydown", function (ev) {
    if (S.view !== "exam" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var s = S.session, q = BY_ID[s.ids[s.cur]];
    if (/^[1-5]$/.test(ev.key)) { var pos = +ev.key - 1; if (pos < q.o.length) { ev.preventDefault(); choose(s.perm[q.id][pos]); } }
    else if (ev.key === "ArrowRight") { ev.preventDefault(); go(s.cur + 1); }
    else if (ev.key === "ArrowLeft") { ev.preventDefault(); go(s.cur - 1); }
    else if (ev.key === "f" || ev.key === "F") { if (s.flags[q.id]) delete s.flags[q.id]; else s.flags[q.id] = true; persistSession(); render(); }
    else if (ev.key === "Enter" && s.practice && !s.checked[q.id] && (s.answers[q.id] || []).length) { s.checked[q.id] = true; persistSession(); render(); }
  });

  // ---------- boot (keeps an in-progress exam across live page updates) ----------
  function start(data) {
    if (data && data.view) { S = data; }
    if (!ALL.length) { app.innerHTML = '<main class="wrap" style="padding-block:40px"><h2>题库没有加载</h2><p class="muted">questions.js 需要和这个页面放在同一个目录。</p></main>'; return; }
    render(); if (S.view === "exam") startTimer();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return S; });
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start(window.claude && window.claude.hot && window.claude.hot.data || {});
})();
</script>
